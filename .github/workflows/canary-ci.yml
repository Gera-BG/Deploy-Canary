name: Canary lab CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-canary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo_canary/canary_lab 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21'
      - name: Unit tests
        run: node --test test/*.test.js
      - name: Start two releases and proxy
        run: docker compose up -d --build
      - name: Wait for HTTP readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
          
      - name: Fix script permissions
        run: chmod +x scripts/*.sh

      - name: Validate canary routing
        run: |
          ./scripts/promote.sh canary10
          ./scripts/sample.sh 100 | tee /tmp/distribution.txt
          grep -q '"version":"v1"' /tmp/distribution.txt
          grep -q '"version":"v2"' /tmp/distribution.txt
      - name: Promote and rollback
        run: |
          wait_for_version() {
            local expected="$1"
            local max_attempts=15
            for i in $(seq 1 $max_attempts); do
              response=$(curl -fsS http://127.0.0.1:8080/api/info 2>/dev/null || echo "")
              if echo "$response" | grep -q "\"version\":\"$expected\""; then
                echo "✅ Versión $expected confirmada tras $i intentos"
                return 0
              fi
              echo "Intento $i/$max_attempts: esperando versión $expected, actual: $response"
              sleep 1
            done
            echo "❌ Timeout esperando versión $expected"
            return 1
          }

          echo "=== Activando green ==="
          ./scripts/promote.sh green
          wait_for_version "v2"

          echo ""
          echo "=== Activando blue ==="
          ./scripts/promote.sh blue
          wait_for_version "v1"
